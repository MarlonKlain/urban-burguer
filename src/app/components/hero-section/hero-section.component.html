<section class="hero">
    <div class="container hero-content">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Urban Burger Logo" class="logo">
        </div>
        <h1 class="title">Urban Burger</h1>
        <p class="subtitle">O melhor sabor da cidade, entregue na sua porta.</p>

        <div class="actions">
            <a routerLink="/menu" class="btn btn-primary">Ver Cardápio</a>
            <a [href]="whatsappLink" target="_blank" class="btn btn-secondary">Pedir Agora</a>
        </div>
    </div>
</section>
