<section class="featured">
    <div class="container">
        <div class="header">
            <h2 class="section-title">Destaques</h2>
            <a routerLink="/menu" class="see-all">Ver tudo</a>
        </div>

        <div class="carousel-wrapper">
            <button class="nav-btn prev" (click)="scrollLeft()">&#10094;</button>

            <div class="scroll-container" #scrollContainer>
                <div class="product-card" *ngFor="let product of products$ | async">
                    <div class="image-wrapper">
                        <img [src]="product.image" [alt]="product.name" class="product-img"
                            onerror="this.src='assets/products/placeholder.svg'">
                    </div>
                    <div class="info">
                        <h3 class="name">{{ product.name }}</h3>
                        <p class="price">{{ product.price | currency:'BRL' }}</p>
                        <button class="add-to-cart-btn" (click)="addToCart(product)">
                            Adicionar ao carrinho
                        </button>
                    </div>
                </div>
            </div>

            <button class="nav-btn next" (click)="scrollRight()">&#10095;</button>
        </div>

        <div class="cta-container">
            <a routerLink="/menu" class="btn btn-secondary full-width">Ver Cardápio Completo</a>
        </div>
    </div>
</section>
